<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · {{ s.hotel_name }}</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="login card">
  <h1>{{ s.hotel_name }}</h1>
  <p class="muted">Owner dashboard</p>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <label>Password</label><input type="password" name="password" autofocus required>
    <p><button type="submit">Log in</button></p>
  </form>
</div></body></html>
